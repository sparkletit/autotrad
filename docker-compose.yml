version: '3.8'

services:
  # Anvil API服务 - 用于管理Anvil启停（调用宅主机的anvil）
  anvil-api:
    image: 2s201l9ub5m6l2.xuanyuan.run/node:20-alpine
    container_name: web3_trad_anvil_api
    ports:
      - "3000:3000"
    volumes:
      - ./docker/scripts/anvil-api.js:/app/anvil-api.js
    working_dir: /app
    command: sh -c "apk add --no-cache bash curl && node anvil-api.js"
    networks:
      - web3_network
    # 注意：在Linux服务器上，需要用实际宅主机IP替换 host.docker.internal
    # 如果要使用 host.docker.internal，请在 docker-compose up 时添加:
    # DOCKER_OPTS="--add-host=host.docker.internal:127.0.0.1"
    # 或在 docker daemon.json 中配置
    restart: unless-stopped
    environment:
      # aнvil 前端的 RPC 地址
      - ANVIL_RPC_URL=${ANVIL_RPC_URL:-http://host.docker.internal:8545}

  # Node.js 应用服务
  nodejs:
    image: 2s201l9ub5m6l2.xuanyuan.run/node:20-alpine
    container_name: web3_trad_nodejs
    env_file:
      - ./docker/env/.env
    ports:
      - "${NODE_PORT:-8888}:8888"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - ANVIL_RPC_URL=${ANVIL_RPC_URL:-http://host.docker.internal:8545}
    volumes:
      - ./docker/code:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    networks:
      - web3_network
    depends_on:
      - mysql
      - anvil-api
    links:
      - anvil-api:anvil-api
    # 注意：在Linux服务器上，需要用实际宅主机IP替换 host.docker.internal
    restart: unless-stopped


  # MySQL 数据库服务
  mysql:
    image: 2s201l9ub5m6l2.xuanyuan.run/mysql:8.0
    container_name: web3_trad_mysql
    env_file:
      - ./docker/env/.env
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./docker/data/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - web3_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

networks:
  web3_network:
    driver: bridge
