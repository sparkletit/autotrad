services:
  # Anvil API服务 - 在容器内运行和管理Anvil Fork网络
  # 注意：使用基于 Debian 的镜像（而非 Alpine）以支持 Foundry 的 glibc 依赖
  anvil-api:
    image: 2s201l9ub5m6l2.xuanyuan.run/node:20
    container_name: web3_trad_anvil_api
    ports:
      - "3000:3000"  # Anvil API 管理端口
      - "8545:8545"  # Anvil RPC 端口
    volumes:
      - ./docker/scripts/anvil-api.js:/app/anvil-api.js
      - ./docker/scripts/install-foundry.sh:/app/install-foundry.sh
      - ./docker/data/anvil-states:/app/anvil-states  # 状态文件目录
      - foundry-cache:/root/.foundry  # 持久化 Foundry 安装，避免每次重启都重新安装
    working_dir: /app
    command: sh -c "chmod +x /app/install-foundry.sh && /app/install-foundry.sh && node anvil-api.js"
    networks:
      - web3_network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 允许容器访问宿主机
    environment:
      # Anvil RPC 地址（容器内）
      - ANVIL_RPC_URL=http://localhost:8545

  # Node.js 应用服务
  nodejs:
    image: 2s201l9ub5m6l2.xuanyuan.run/node:20-alpine
    container_name: web3_trad_nodejs
    env_file:
      - ./docker/env/.env
    ports:
      - "${NODE_PORT:-8888}:8888"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - ANVIL_RPC_URL=${ANVIL_RPC_URL:-http://anvil-api:8545}
      - ANVIL_API_URL=${ANVIL_API_URL:-http://anvil-api:3000}
      - ANVIL_STATES_DIR=/app/anvil-states
    volumes:
      - ./docker/code:/app
      - ./docker/data/anvil-states:/app/anvil-states  # 状态文件目录（与 anvil-api 共享）
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    networks:
      - web3_network
    depends_on:
      - mysql
      - anvil-api
    restart: unless-stopped

  # MySQL 数据库服务
  mysql:
    image: 2s201l9ub5m6l2.xuanyuan.run/mysql:8.0
    container_name: web3_trad_mysql
    env_file:
      - ./docker/env/.env
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./docker/data/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - web3_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  foundry-cache:
    driver: local

networks:
  web3_network:
    driver: bridge
